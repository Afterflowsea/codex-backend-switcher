name: smoke

# 只在改到代码/测试时跑，避免改文档也触发
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "bin/**"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "bin/**"
      - "tests/**"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        shell: powershell
        run: |
          $PSVersionTable | Out-String
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)"

      - name: 离线冒烟测试
        shell: powershell
        run: .\tests\smoke.ps1

      # 逻辑放在 tests\syntax-check.ps1 里：workflow 内联脚本是 UTF-8 无 BOM，
      # 含中文时 PowerShell 5.1 会解析失败（表现为 0 秒失败）。
      - name: 所有脚本可被解析（语法检查）
        shell: powershell
        run: .\tests\syntax-check.ps1
